<!doctype html>
<!-- AI-assisted code (Claude) written during NASA Space Apps Challenge 2026. See AI_USE.md. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlinkStage demo</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/app/styles/tokens.css" />
    <style>
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 var(--font); }
      main { display: grid; grid-template-columns: 640px 1fr; gap: var(--gap); padding: var(--gap); }
      #stage { width: 640px; height: 640px; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
      .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--gap); }
      .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; align-items: center; }
      .row span { color: var(--muted); min-width: 72px; }
      button { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 10px; font: inherit; cursor: pointer; }
      button[aria-pressed='true'] { border-color: var(--accent); color: var(--accent); }
      pre { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: pre-wrap; margin: 0; }
      @media (max-width: 960px) { main { grid-template-columns: 1fr; } #stage { width: 100%; height: auto; aspect-ratio: 1; } }
    </style>
  </head>
  <body>
    <main>
      <div id="stage"></div>
      <div class="panel" id="controls"></div>
    </main>
    <script type="module" src="./blink-stage.ts"></script>
  </body>
</html>
