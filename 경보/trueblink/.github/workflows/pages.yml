# AI-assisted (Claude) during NASA Space Apps Challenge 2026. See AI_USE.md.
# Fallback hosting on GitHub Pages, run by hand only (Actions tab > GitHub Pages fallback > Run workflow).
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# GitHub Pages cannot run the /api/sia relay. Leave "api_base" empty and only the five challenge
# targets (and the other baked presets) open; or enter the address of a relay you host elsewhere,
# for example https://<project>.pages.dev/api or https://<relay-host>/api, and every search works.
name: GitHub Pages fallback

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'Relay base URL (VITE_API_BASE), e.g. https://<project>.pages.dev/api. Empty = no relay.'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_API_BASE: ${{ inputs.api_base }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
