# AI-assisted (Claude) during NASA Space Apps Challenge 2026. See AI_USE.md.
# Re-bake the preset exposure lists and pixel bundles (public/presets) from the live SPHEREx archive,
# e.g. after a new data release. Runs when started by hand (Actions tab > Re-bake presets > Run workflow)
# and once a week. It never changes the main branch by itself: when the exposure lists changed it
# pushes the branch auto/rebake-presets and opens (or updates) one pull request for a person to merge.
# Needs no secrets. For the pull request step, enable: Settings > Actions > General > Workflow
# permissions > "Allow GitHub Actions to create and approve pull requests". Without it the branch is
# still pushed and you can open the pull request yourself.
name: Re-bake presets

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1' # Mondays 03:23 UTC

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rebake
  cancel-in-progress: false

jobs:
  rebake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Bake from the live archive (IRSA SIA + SPHEREx S3, about 3 minutes)
        run: npx tsx scripts/bake-presets.ts

      - name: Check whether any exposure list changed (the bake date alone does not count)
        id: diff
        run: |
          node --input-type=module <<'EOF'
          import { execSync } from 'node:child_process';
          import { readFileSync, readdirSync, appendFileSync } from 'node:fs';
          const ids = (text) => JSON.stringify((JSON.parse(text).exposures ?? []).map((e) => e.id).sort());
          const changed = [];
          for (const f of readdirSync('public/presets').filter((n) => /^[A-Za-z0-9_-]+\.json$/.test(n))) {
            const path = `public/presets/${f}`;
            let before = '';
            try { before = ids(execSync(`git show HEAD:${path}`, { encoding: 'utf8', maxBuffer: 1 << 28 })); } catch { before = 'new'; }
            const after = ids(readFileSync(path, 'utf8'));
            if (before !== after) changed.push(f);
          }
          console.log(changed.length ? `Exposure lists changed: ${changed.join(', ')}` : 'No exposure list changed.');
          appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed.join(' ')}\n`);
          EOF

      - name: Unit tests on the new files
        if: steps.diff.outputs.changed != ''
        run: npm test

      - name: Push branch and open a pull request
        if: steps.diff.outputs.changed != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.diff.outputs.changed }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          branch=auto/rebake-presets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add public/presets
          git commit -m "Re-bake SPHEREx presets ($(date -u +%Y-%m-%d)): $CHANGED"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "$BASE" --head "$branch" \
              --title "Re-bake SPHEREx presets" \
              --body "Automatic re-bake from the live SPHEREx archive. Changed exposure lists: $CHANGED. Check the five challenge targets on the Cloudflare preview link of this pull request before merging. Do not merge during the judging period unless the rules allow changes." \
              || echo "Could not open the pull request (see the note at the top of this workflow); the branch $branch is pushed."
          fi
