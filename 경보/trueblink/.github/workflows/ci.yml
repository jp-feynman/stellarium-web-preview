# AI-assisted (Claude) during NASA Space Apps Challenge 2026. See AI_USE.md.
# Type check, unit tests and production build on every push and pull request.
# Offline only: live archive tests (LIVE=1) are not run here.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npx vite build
      - name: Size of dist (Cloudflare Pages allows 25 MiB per file and 20,000 files)
        run: |
          echo "files: $(find dist -type f | wc -l)"
          du -sh dist
          big=$(find dist -type f -size +24M)
          if [ -n "$big" ]; then echo "Files over 24 MB: $big"; exit 1; fi
