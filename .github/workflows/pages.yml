name: Publish SPHEREx Sky Lab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 경보/trueblink/package-lock.json
      - name: Install locked analysis dependencies
        run: npm run setup
      - name: Check routing, celestial coordinates and screen transitions
        run: npm test
      - name: Check analysis and progressive loading
        run: npm --prefix 경보/trueblink test
      - name: Build entrance, planetarium and analysis workbench
        env:
          # The team's existing public SPHEREx-only relay supports CORS from Pages.
          # GitHub Pages itself cannot execute a Node /api/sia service.
          VITE_API_BASE: https://trueblink.pages.dev/api
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
