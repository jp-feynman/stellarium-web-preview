<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>NR debug</title></head>
<body>
<pre id="out"></pre>
<script src="../../bbh-nr-id.js"></script>
<script src="../../bbh-nr.js"></script>
<script>
"use strict";
const log = (s) => { document.getElementById("out").textContent += s + "\n"; console.log(s); };
try {
  const c = document.createElement("canvas"); c.width = c.height = 4;
  const gl = c.getContext("webgl2");
  const ext1 = gl.getExtension("EXT_color_buffer_float");
  const ext2 = gl.getExtension("OES_texture_float_linear");
  log("EXT_color_buffer_float: " + !!ext1 + ", OES_texture_float_linear: " + !!ext2);
  log("MAX_DRAW_BUFFERS: " + gl.getParameter(gl.MAX_DRAW_BUFFERS));
  log("MAX_TEXTURE_IMAGE_UNITS: " + gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS));
  log("RGBA32F = " + gl.RGBA32F + ", FLOAT = " + gl.FLOAT);
  const nr = new BBHNR(gl, { N: 32, L: 10 });
  log("BBHNR created OK: W=" + nr.g.W + " H=" + nr.g.H + " TX=" + nr.g.TX + " TY=" + nr.g.TY);
} catch (e) {
  log("ERROR: " + e.message);
  log("STACK: " + (e.stack || "").split("\n").slice(0, 5).join("\n"));
}
</script>
</body></html>
