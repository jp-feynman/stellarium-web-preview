<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>NR binary debug 3 (v sweep)</title></head>
<body>
<pre id="out"></pre>
<script src="../../bbh-nr-id.js"></script>
<script src="../../bbh-nr.js"></script>
<script>
"use strict";
const log = (s) => { document.getElementById("out").textContent += s + "\n"; console.log(s); };
async function runV(v) {
  const c = document.createElement("canvas"); c.width = c.height = 4;
  const gl = c.getContext("webgl2");
  gl.getExtension("EXT_color_buffer_float"); gl.getExtension("OES_texture_float_linear");
  const nr = new BBHNR(gl, { N: 64, L: 10 });
  const d = 6.5;
  nr.setPair([{ M: 0.5, x: d / 2, y: 0, vx: 0, vy: v }, { M: 0.5, x: -d / 2, y: 0, vx: 0, vy: -v }], { solve: true });
  let sep0 = Math.hypot(nr.posNow[0]-nr.posNow[2], nr.posNow[1]-nr.posNow[3]);
  nr.advance(20.0, 64);
  let sep1 = Math.hypot(nr.posNow[0]-nr.posNow[2], nr.posNow[1]-nr.posNow[3]);
  let merged = null;
  for (let t = 20; t < 100; t += 20) {
    nr.advance(20.0, 64);
    const sep = Math.hypot(nr.posNow[0]-nr.posNow[2], nr.posNow[1]-nr.posNow[3]);
    if (!Number.isFinite(sep)) { merged = "NaN"; break; }
    if (sep < 1) { merged = +t.toFixed(1); break; }
  }
  log("v=" + v.toFixed(2) + " sep0=" + sep0.toFixed(4) + " sep20=" + sep1.toFixed(4) + " sep100=" + Math.hypot(nr.posNow[0]-nr.posNow[2], nr.posNow[1]-nr.posNow[3]).toFixed(4) + " merged=" + merged);
}
(async () => {
  for (const v of [0.23, 0.30, 0.39, 0.45]) await runV(v);
})();
</script>
</body></html>
