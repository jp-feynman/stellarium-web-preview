<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>NR binary debug</title></head>
<body>
<pre id="out"></pre>
<script src="../../bbh-nr-id.js"></script>
<script src="../../bbh-nr.js"></script>
<script>
"use strict";
const log = (s) => { document.getElementById("out").textContent += s + "\n"; console.log(s); };
try {
  const c = document.createElement("canvas"); c.width = c.height = 4;
  const gl = c.getContext("webgl2");
  gl.getExtension("EXT_color_buffer_float"); gl.getExtension("OES_texture_float_linear");
  const nr = new BBHNR(gl, { N: 64, L: 10 });
  const d = 6.5, v = 0.23;
  nr.setPair([{ M: 0.5, x: d / 2, y: 0, vx: 0, vy: v }, { M: 0.5, x: -d / 2, y: 0, vx: 0, vy: -v }], { solve: true });
  log("initial pos: " + JSON.stringify(nr.posNow));
  log("bare masses: " + nr.id.punctures.map(p => +p.m.toFixed(4)));
  log("ua: " + nr.id.ua.map(x => +x.toFixed(5)));
  nr.trace(1);
  const sh0 = [];
  const R = nr.lensRes, L = nr.g.L, lm = nr.readLens();
  function escAt(x, y) {
    const u = ((x + L) / (2 * L)) * R - 0.5, v = ((y + L) / (2 * L)) * R - 0.5;
    const i = Math.floor(u), j = Math.floor(v), a = u - i, b = v - j;
    const e = (ii, jj) => lm[4 * (jj * R + ii) + 2];
    return (1 - a) * (1 - b) * e(i, j) + a * (1 - b) * e(i + 1, j) + (1 - a) * b * e(i, j + 1) + a * b * e(i + 1, j + 1);
  }
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    let found = null;
    for (let s = 0; s < L; s += 0.01) {
      if (escAt(dx * s, dy * s) >= 0.5) { found = s; break; }
    }
    sh0.push(found);
  }
  log("shadow0: " + JSON.stringify(sh0.map(s => s != null ? +s.toFixed(3) : null)));
  let steps = 0;
  for (let t = 0; t < 100; t += 10) {
    steps += nr.advance(10, 64);
    const [x1, y1, x2, y2] = nr.posNow;
    const sep = Math.hypot(x1 - x2, y1 - y2);
    log("t=" + nr.t.toFixed(1) + " pos=[" + x1.toFixed(3) + "," + y1.toFixed(3) + "," + x2.toFixed(3) + "," + y2.toFixed(3) + "] sep=" + sep.toFixed(4) + " finite=" + Number.isFinite(sep));
    if (!Number.isFinite(sep) || sep < 1) break;
  }
  log("total steps: " + steps);
  if (nr.t >= 100 && Number.isFinite(Math.hypot(nr.posNow[0] - nr.posNow[2], nr.posNow[1] - nr.posNow[3]))) {
    const sep = Math.hypot(nr.posNow[0] - nr.posNow[2], nr.posNow[1] - nr.posNow[3]);
    log("final sep at t=100: " + sep.toFixed(4));
  }
} catch (e) {
  log("ERROR: " + e.message);
  log("STACK: " + (e.stack || "").split("\n").slice(0, 5).join("\n"));
}
</script>
</body></html>
