<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>NR binary debug 2</title></head>
<body>
<pre id="out"></pre>
<script src="../../bbh-nr-id.js"></script>
<script src="../../bbh-nr.js"></script>
<script>
"use strict";
const log = (s) => { document.getElementById("out").textContent += s + "\n"; console.log(s); };
try {
  const c = document.createElement("canvas"); c.width = c.height = 4;
  const gl = c.getContext("webgl2");
  gl.getExtension("EXT_color_buffer_float"); gl.getExtension("OES_texture_float_linear");
  const nr = new BBHNR(gl, { N: 64, L: 10 });
  const d = 6.5, v = 0.23;
  nr.setPair([{ M: 0.5, x: d / 2, y: 0, vx: 0, vy: v }, { M: 0.5, x: -d / 2, y: 0, vx: 0, vy: -v }], { solve: true });
  const g = nr.g, L = g.L, H = g.h;
  log("initial: pos=" + JSON.stringify(nr.posNow.map(x => +x.toFixed(4))) + " bare=" + nr.id.punctures.map(p => +p.m.toFixed(4)));

  nr.advance(1.0, 64);
  log("after t=1: pos=" + JSON.stringify(nr.posNow.map(x => +x.toFixed(4))) + " sep=" + Math.hypot(nr.posNow[0]-nr.posNow[2], nr.posNow[1]-nr.posNow[3]).toFixed(4));

  // Read beta texture at puncture 1 location (T2 = beta_x, beta_y, beta_z, K)
  const betaTex = nr.read(2);
  const x1 = nr.posNow[0], y1 = nr.posNow[1];
  const fx = (x1 + L) / H - 0.5, fy = (y1 + L) / H - 0.5;
  const ci = Math.round(fx), cj = Math.round(fy);
  const cell = (i,j,k) => 4 * (((k / g.TX | 0) * g.N + j) * g.W + (k % g.TX) * g.N + i);
  const cellIdx = cell(ci, cj, 0);
  log("beta near puncture1: bx=" + betaTex[cellIdx].toFixed(4) + " by=" + betaTex[cellIdx+1].toFixed(4) + " bz=" + betaTex[cellIdx+2].toFixed(4) + " K=" + betaTex[cellIdx+3].toFixed(4));

  nr.advance(9.0, 64);
  log("after t=10: pos=" + JSON.stringify(nr.posNow.map(x => +x.toFixed(4))) + " sep=" + Math.hypot(nr.posNow[0]-nr.posNow[2], nr.posNow[1]-nr.posNow[3]).toFixed(4));
  nr.advance(90.0, 64);
  log("after t=100: pos=" + JSON.stringify(nr.posNow.map(x => +x.toFixed(4))) + " sep=" + Math.hypot(nr.posNow[0]-nr.posNow[2], nr.posNow[1]-nr.posNow[3]).toFixed(4));
} catch (e) {
  log("ERROR: " + e.message);
  log("STACK: " + (e.stack || "").split("\n").slice(0, 5).join("\n"));
}
</script>
</body></html>
