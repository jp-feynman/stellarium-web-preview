<!doctype html><html lang="ko"><head><meta charset="utf-8"><base href="../../"><title>광학 경계 동기화 검증</title>
<style>body{margin:0;background:#10151e;color:white;font:14px system-ui}#host{position:relative;width:960px;height:640px}canvas{width:100%;height:100%}pre{white-space:pre-wrap}button{padding:10px}</style></head>
<body><button id="run">이동·병합 광학 검사</button><div id="host"><canvas id="sky"></canvas></div><pre id="out">준비</pre>
<script src="bbh-physics.js"></script><script src="bbh-eob.js"></script><script src="bbh-sim.js"></script><script src="gravity-hero.js"></script>
<script>
class OpticalHero extends GravityHero {
 _seed(){}
 _loadSky(){const c=document.createElement('canvas');c.width=c.height=2;const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,2,2);this.setBackground(c,'test');}
}
const h=new OpticalHero(document.querySelector('#sky'),{host:document.querySelector('#host')});h.setActive(false);h.diagnostic=1;
async function optics(){
 const gl=h.gl,W=h.canvas.width,H=h.canvas.height,pixels=new Uint8Array(4*W*H),results=[];
 function check(label,single=null){
  h._draw(1);gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
  let mismatch=0,analyticWrong=0,analyticChecked=0;
  const k=h.kRad,cx=h._skyCenter();
  let nb;if(single){const lon=-(single.x-cx)*k,lat=(h.h/2-single.y)*k;nb=[Math.cos(lat)*Math.cos(lon),Math.cos(lat)*Math.sin(lon),Math.sin(lat)];}
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){
    const p=4*(j*W+i),red=pixels[p]/255,green=pixels[p+1]/255;
    if(Math.abs(red-green)>.9)mismatch++;
    if(single){
      const x=(i+.5)*h.w/W,y=h.h-(j+.5)*h.h/H,lon=-(x-cx)*k,lat=(h.h/2-y)*k;
      const n=[Math.cos(lat)*Math.cos(lon),Math.cos(lat)*Math.sin(lon),Math.sin(lat)];
      const dot=Math.max(-1,Math.min(1,n[0]*nb[0]+n[1]*nb[1]+n[2]*nb[2])),theta=Math.acos(dot),critical=3*Math.sqrt(3)*single.M*k;
      if(Math.abs(theta-critical)>2.5*k){analyticChecked++;if((theta<critical&&red>.1)||(theta>critical&&red<.9))analyticWrong++;}
    }
  }
  results.push({label,mismatchFraction:mismatch/(W*H),analyticWrong,analyticChecked,glError:gl.getError()});
 }
 for(const [x,y,M]of[[480,320,8],[180,70,24],[720,570,24],[760,110,65],[240,530,65]]){
  h.sim=new BBHSim({c:h.C,hist:h.HIST});const b=h.sim.add(x,y,0,0,M);check(`single ${x},${y},M=${M}`,b);
 }
 h.sim=new BBHSim({c:h.C,hist:h.HIST});const moving=h.sim.add(140,100,30,12,18);
 for(let frame=0;frame<8;frame++){moving.x=140+80*frame;moving.y=300+200*Math.sin(frame*.6);check(`moving frame=${frame}`,moving);}
 for(const phi of [0,1.3,-2.2]){
  h.sim=new BBHSim({c:h.C,hist:h.HIST});const a=h.sim.add(480+12*Math.cos(phi),220+12*Math.sin(phi),0,30,8),b=h.sim.add(480-12*Math.cos(phi),220-12*Math.sin(phi),0,-30,8);
  const R=h.sim._merge(a,b),m=R.morph;
  for(const t of [0,.3,1,2,4,6]){m.t=t*m.tauS;check(`merge phi=${phi},t=${t}tau`);}
  const wave=h.sim.slots.find(s=>s.kind==='ring');wave.head=h.HIST-1;wave.x=350;wave.y=420;wave.near=12;wave.peak=2;
  for(let i=0;i<h.HIST;i++){wave.buf[2*i]=2;wave.buf[2*i+1]=1;}
  h.sim.t=8;h.sim.nextSample=8+h.sim.DT_S;h.waveSim=null;check(`merge+GW phi=${phi}`);
 }
 const pass=results.every(r=>r.mismatchFraction<.004&&r.analyticWrong===0&&r.glError===0);
 const result={pass,viewport:[h.w,h.h],buffer:[W,H],cases:results.length,results};document.querySelector('#out').textContent=JSON.stringify(result,null,2);return result;
}
async function waves(){
 h.sim=new BBHSim({c:h.C,hist:h.HIST});h.diagnostic=2;
 const s=h.sim.slots[0],T=2.4;s.key='test-wave';s.kind='drain';s.x=480;s.y=320;s.near=12;s.peak=1;
 s.head=Math.round(T/h.sim.DT_S);h.sim.t=s.head*h.sim.DT_S;h.sim.nextSample=h.sim.t+h.sim.DT_S;
 for(let i=0;i<=s.head;i++){const k=i%h.HIST;s.buf[2*k]=0;s.buf[2*k+1]=i*h.sim.DT_S>=2?1:0;}
 h.waveSim=null;h._draw(1);const gl=h.gl,W=h.canvas.width,H=h.canvas.height,p=new Uint8Array(4*W*H);gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,p);
 const checks=[];
 for(const radius of [60,120,180,250]){
  const x=480+radius,y=320,i=Math.floor(x/h.w*W),j=H-1-Math.floor(y/h.h*H),k=4*(j*W+i);
  const emittedAt=h.sim.t-radius/h.C,shouldArrive=emittedAt>=2,delta=Math.max(Math.abs(p[k]-128),Math.abs(p[k+1]-128));
  checks.push({radius,emittedAt,shouldArrive,delta,pass:shouldArrive?delta>2:delta<=1});
 }
 const first={c:h.C,sourceTime:h.sim.t,frontRadius:(h.sim.t-2)*h.C};
 // A short packet whose emitter stopped 3.6 seconds ago must still exist
 // at a distant pixel; current-amplitude culling used to erase it too early.
 h.C=80;h.sim=new BBHSim({c:80,hist:h.HIST});const lateSlot=h.sim.slots[0];
 lateSlot.key='late';lateSlot.kind='drain';lateSlot.x=480;lateSlot.y=320;lateSlot.near=12;lateSlot.head=-1;
 for(let i=0;i<=1536;i++){h.sim.t=i*h.sim.DT_S;h.sim._push(lateSlot,0,h.sim.t>=2&&h.sim.t<=2.8?1:0);}
 h.sim.nextSample=h.sim.t+h.sim.DT_S;h.waveSim=null;h._draw(1);gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,p);
 const lateChecks=[];
 for(const radius of [260,320,390]){const i=Math.floor((480+radius)/h.w*W),j=H-1-Math.floor(320/h.h*H),k=4*(j*W+i),emittedAt=h.sim.t-radius/80;
 const shouldArrive=emittedAt>=2&&emittedAt<=2.8,delta=Math.max(Math.abs(p[k]-128),Math.abs(p[k+1]-128));
 lateChecks.push({radius,emittedAt,shouldArrive,delta,pass:shouldArrive?delta>2:delta<=1});}
 const result={pass:[...checks,...lateChecks].every(x=>x.pass)&&gl.getError()===0,...first,checks,latePacket:{sourceTime:h.sim.t,lastEmission:2.8,historyPeak:lateSlot.peak,currentPeak:lateSlot.currentPeak,checks:lateChecks}};document.querySelector('#out').textContent=JSON.stringify(result,null,2);return result;
}
window.tests={optics,waves};document.querySelector('#run').onclick=optics;
</script></body></html>
