<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>NR binary debug 4 (K and A tracking)</title></head>
<body>
<pre id="out"></pre>
<script src="../../bbh-nr-id.js"></script>
<script src="../../bbh-nr.js"></script>
<script>
"use strict";
const log = (s) => { document.getElementById("out").textContent += s + "\n"; console.log(s); };
try {
  const c = document.createElement("canvas"); c.width = c.height = 4;
  const gl = c.getContext("webgl2");
  gl.getExtension("EXT_color_buffer_float"); gl.getExtension("OES_texture_float_linear");
  const nr = new BBHNR(gl, { N: 64, L: 10 });
  const d = 6.5, v = 0.23;
  nr.setPair([{ M: 0.5, x: d / 2, y: 0, vx: 0, vy: v }, { M: 0.5, x: -d / 2, y: 0, vx: 0, vy: -v }], { solve: true });
  const g = nr.g;

  function stats() {
    const T2 = nr.read(2); // T2 = (beta_x, beta_y, beta_z, K)
    const T3 = nr.read(3); // T3 = (Axx, Axy, Axz, Ayy)
    const T4 = nr.read(4); // T4 = (Ayz, Azz, Gamx, Gamy)
    let maxK = 0, maxA = 0, maxGam = 0;
    const nz = g.NZ, n = g.N;
    for (let k = 0; k < nz; k++) for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
      const cell = 4 * (((k / g.TX | 0) * g.N + j) * g.W + (k % g.TX) * g.N + i);
      maxK = Math.max(maxK, Math.abs(T2[cell + 3]));
      maxA = Math.max(maxA, Math.abs(T3[cell]), Math.abs(T3[cell + 1]), Math.abs(T3[cell + 2]), Math.abs(T3[cell + 3]),
                      Math.abs(T4[cell]), Math.abs(T4[cell + 1]));
      maxGam = Math.max(maxGam, Math.abs(T4[cell + 2]), Math.abs(T4[cell + 3]));
    }
    return { maxK, maxA, maxGam };
  }

  let s0 = stats();
  log("t=0: sep=6.5000 maxK=" + s0.maxK.toFixed(4) + " maxA=" + s0.maxA.toFixed(4) + " maxGam=" + s0.maxGam.toFixed(4));

  for (let t = 10; t <= 100; t += 10) {
    nr.advance(10, 64);
    const [x1, y1, x2, y2] = nr.posNow;
    const sep = Math.hypot(x1 - x2, y1 - y2);
    const st = stats();
    log("t=" + nr.t.toFixed(1) + " sep=" + sep.toFixed(4) + " maxK=" + st.maxK.toFixed(4) + " maxA=" + st.maxA.toFixed(4) + " maxGam=" + st.maxGam.toFixed(4));
    if (!Number.isFinite(sep)) break;
  }
} catch (e) {
  log("ERROR: " + e.message);
  log("STACK: " + (e.stack || "").split("\n").slice(0, 5).join("\n"));
}
</script>
</body></html>
